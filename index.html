                usage: "Personalización de experiencia de usuario en bibliotecas de medios.", 
                storyTitle: "El Reto de Palomitacas", 
                story: `Hace años empecé a usar una web llamada Palomitacas. La elegí porque tenía una función que me encantaba: me decía qué nota le daría yo a una película antes de verla. Un día, esa función desapareció sin explicación. En aquel entonces, yo estaba empezando en el análisis de datos y ML, así que intenté replicarla por mi cuenta. Fracasé estrepitosamente y lo dejé aparcado.\n\nHace unos meses decidí retomar ese reto personal para ver cuánto había mejorado. Sabía que mi base de datos era ínfima y que extraer señal de ahí sería como intentar 'matar moscas a cañonazos', pero me daba igual: quería exprimir cada dato y ver hasta dónde podía llegar. No buscaba un modelo perfecto ni métricas de libro, buscaba una herramienta que me guiase.\n\nEl resultado es un proyecto de Machine Learning en Python que integra APIs, técnicas de AutoML y modelos personalizados. Es una solución humilde, pero que funciona y cumple su objetivo. Espero volver a este dataset en el futuro con más conocimientos y ver cómo siguen evolucionando las métricas.`

                storyTitle: "La Búsqueda de Alpha", 
                story: `Prácticamente desde que empecé con Python, sabía que quería aplicarlo a las finanzas y los datos, pero era consciente de su complejidad. Por ello, decidí posponerlo para centrarme en mis estudios y la Selectividad. Todo cambió un día charlando con mi Jefe de Estudios; vi en su ordenador el icono de MetaTrader 5 y no pude evitar preguntar. Me explicó que tenía una estrategia automatizada para el EURUSD, pero que le había costado años desarrollarla y no pensaba desvelar su 'secreto' a nadie.\n\nEse día volví a casa con un reto personal: yo también quería construir algo así. Él era alguien con carrera, máster y años de experiencia, pero aun así acepté el desafío. Pasé tardes, días y semanas enteras experimentando con Python, intercalando mis estudios con la búsqueda de esa idea ganadora y otros proyectos con python. Fracasé una y otra vez. Cada vez que creía tener algo que funcionaba, descubría rastros de data leakage o contaminación de datos. En cuanto corregía el error, la rentabilidad se esfumaba.\n\nTras muchos intentos, dejé de intentar ignorar la dura realidad: me faltaban Alphas (señales predictivas reales). Sabía que 'si entra basura, sale basura'. Por eso, con la estadística en la mano, decidí centrarme en construir el pipeline que me ayudaría en el proceso.\n\nEmprendí este proyecto sabiendo que los indicadores convencionales están muy explotados y que las probabilidades de éxito inmediato eran bajas. Sin embargo, el resultado fue un éxito en lo que realmente importa: he creado una infraestructura robusta para testear ideas con rigor científico y separar, por fin, la suerte de la verdadera ventaja estadística. Ahora no solo tengo código; tengo un método sólido para validar cualquier Alpha que surja en el futuro.`

                storyTitle: "Rigor vs. Hype Académico", 
                story: `Tras dedicar mucho tiempo a intentar diseñar un sistema propio que fuese robusto, llegué a una conclusión lógica: existen investigadores y mentes brillantes que ya han publicado soluciones avanzadas. ¿Por qué no apoyarme en su experiencia? Así fue como, tras una búsqueda intensiva de literatura técnica, descubrí el paper SRDDQN.\n\nLo que me cautivó de este estudio fue el uso de TimesNet. Me pareció fascinante encontrar una arquitectura que tratase las series temporales como imágenes mediante la Transformada de Fourier, que es, casualmente, uno de mis conceptos matemáticos favoritos. La posibilidad de aplicar visión por computador al análisis financiero, sumada a un mecanismo de auto-recompensa dinámica (donde la IA decide cómo premiar su propio aprendizaje), me motivó a implementar el proyecto por completo.\n\nEl proceso fue exigente: desde el diseño de diagramas de flujo hasta la reconstrucción de los gráficos de rendimiento. Sin embargo, la réplica también me aportó una lección valiosa sobre el rigor en la investigación. El paper original reportaba rentabilidades y Ratios de Sharpe extraordinarios que, en mi implementación, no se alcanzaron.\n\nAl analizar las causas, identifiqué factores críticos: el paper utiliza un split simple de train y test, lo que facilita un sobreajuste (overfitting) a este último. Además, con casi total seguridad, el estudio omite el impacto del spread entre Bid y Ask. En mi réplica, al ser más estricto con los costes reales de ejecución, los resultados fueron más humildes, pero también más honestos y cercanos a la realidad del mercado. A pesar de la discrepancia en las métricas, este proyecto ha sido una de las experiencias de aprendizaje más enriqueceras que he tenido.`

          footer: { locationLabel: "Ubicación", location: "Sevilla, España", contactLabel: "Contacto", aboutLabel: "Sobre mí", about: "Me gusta aprender y mejorar constantemente. Soy curioso, constante y risueño, y disfruto trabajando en equipo y ayudando a otras personas a entender conceptos complejos de forma clara y estructurada." }

      // --- UTILS ---
      const useGSAP = (callback, deps = []) => {
        useLayoutEffect(() => {
          const ctx = gsap.context(callback);
          return () => ctx.revert();
        }, deps);
      };

      const MagneticButton = ({ children, className = "" }) => {
        const btnRef = useRef(null);
        useGSAP(() => {
          const el = btnRef.current;
          const xTo = gsap.quickTo(el, "x", { duration: 1, ease: "elastic.out(1, 0.3)" });
          const yTo = gsap.quickTo(el, "y", { duration: 1, ease: "elastic.out(1, 0.3)" });
          const mouseMove = (e) => {
            const { clientX, clientY } = e;
            const { height, width, left, top } = el.getBoundingClientRect();
            xTo((clientX - (left + width / 2)) * 0.35);
            yTo((clientY - (top + height / 2)) * 0.35);
          };
          const mouseLeave = () => { xTo(0); yTo(0); };
          el.addEventListener("mousemove", mouseMove);
          el.addEventListener("mouseleave", mouseLeave);
          return () => { el.removeEventListener("mousemove", mouseMove); el.removeEventListener("mouseleave", mouseLeave); };
        }, []);
        return React.cloneElement(children, { ref: btnRef, className: `${children.props.className || ""} ${className}` });
      };

                   <div className="mt-12 flex items-center gap-4"><span className="font-mono text-xs uppercase tracking-widest opacity-50">{t.projects.cta}</span><ArrowRight size={16} className="animate-pulse" /></div>
                </div>
                {t.projects.items.map((p, i) => (
                  <div key={i} className="w-[85vw] md:w-[75vw] h-full flex-shrink-0 flex flex-col justify-between p-12 md:p-24 border-r border-white/10 relative group">
                     <span className="absolute top-12 left-12 font-mono text-[15rem] md:text-[20rem] opacity-[0.03] font-bold leading-none select-none pointer-events-none">{p.id}</span>
                     <div className="relative z-10 h-full flex flex-col justify-end">
                        <span className="font-mono text-xs uppercase tracking-widest text-brand-accent mb-4 block">{p.sub}</span>
                        <h3 className="text-5xl md:text-7xl font-bold tracking-tighter mb-8">{p.title}</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 border-t border-brand-accent/20 pt-8 mb-12">
                            <div><span className="font-mono text-[10px] uppercase tracking-widest text-brand-accent/80 mb-2 block">{t.projects.labels.problem}</span><p className="text-brand-cream/70 text-sm">{p.problem}</p></div>
                            <div><span className="font-mono text-[10px] uppercase tracking-widest text-brand-accent/80 mb-2 block">{t.projects.labels.solution}</span><p className="text-brand-cream/70 text-sm">{p.solution}</p></div>
                            <div><span className="font-mono text-[10px] uppercase tracking-widest text-brand-accent/80 mb-2 block">{t.projects.labels.usage}</span><p className="text-brand-cream/70 text-sm">{p.usage}</p></div>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setActiveStory(p)} className="px-8 py-4 bg-brand-cream text-brand-blue rounded-full font-mono text-[10px] uppercase tracking-widest hover:bg-brand-accent hover:text-white transition-colors flex items-center gap-2"><BookOpen size={14} /> {t.projects.labels.storyBtn}</button>
                            <a href={p.link} target="_blank" className="px-8 py-4 border border-brand-cream/20 rounded-full font-mono text-[10px] uppercase tracking-widest hover:bg-brand-cream hover:text-brand-blue transition-colors flex items-center gap-2">{t.projects.labels.linkBtn} <ArrowUpRight size={14} /></a>
                        </div>
                     </div>
                  </div>
                ))}
             </div>
          </section>
          {activeStory && (
            <div className="fixed inset-0 z-[100] pointer-events-auto">
              <div onClick={() => setActiveStory(null)} className="absolute inset-0 bg-brand-dark/60 backdrop-blur-sm"></div>
              <div className="absolute top-0 right-0 h-full w-full md:w-[600px] bg-brand-cream text-brand-blue shadow-2xl p-8 md:p-12 overflow-y-auto">
                <button onClick={() => setActiveStory(null)} className="absolute top-8 right-8 w-10 h-10 border border-brand-blue/20 rounded-full flex items-center justify-center hover:bg-brand-blue hover:text-brand-cream transition-colors"><X size={18} /></button>
                <div className="pt-12 pb-32">
                   <span className="font-mono text-xs uppercase tracking-widest text-brand-accent mb-4 block">{t.projects.labels.storyBtn}</span>
                   <h2 className="text-4xl font-bold tracking-tight mb-8 leading-[1.1]">{activeStory.storyTitle}</h2>
                   <div className="prose prose-lg text-brand-blue/80 leading-relaxed space-y-6">{activeStory.story.split('\n').map((p, i) => p.trim() && <p key={i}>{p}</p>)}</div>
                </div>
              </div>
            </div>
          )}
          </>
        );
      };

      const EducationVertical = () => {
        const { t, lang } = useContext(LanguageContext);
        const [activeIdx, setActiveIdx] = useState(0);
        useGSAP(() => {
          gsap.utils.toArray('.edu-card').forEach((item, i) => {
            ScrollTrigger.create({ trigger: item, start: "top center", end: "bottom center", onEnter: () => setActiveIdx(i), onEnterBack: () => setActiveIdx(i) });
          });
        }, [lang]);

        return (
          <section id="trajectory" className="relative flex flex-col md:flex-row bg-brand-cream border-t border-brand-blue/10">
            <div className="w-full md:w-1/2 h-auto md:h-screen sticky top-0 flex flex-col justify-between p-8 md:p-16 border-r border-brand-blue/10 bg-brand-cream z-10">
              <div><span className="font-mono text-xs uppercase tracking-widest text-brand-blue/50 mb-4 block">{t.edu.section}</span><h2 className="text-5xl md:text-7xl font-bold text-brand-blue tracking-tighter mb-8">{t.edu.title[0]}<br/>{t.edu.title[1]}</h2></div>
              <div className="hidden md:flex flex-col gap-4">
                 {t.edu.items.map((e, i) => (
                   <div key={i} className={`transition-all duration-500 flex items-center gap-4 ${activeIdx === i ? 'opacity-100 translate-x-4' : 'opacity-30'}`}><span className="font-mono text-xs">0{i+1}</span><span className="text-xl font-medium truncate max-w-[250px]">{e.title}</span></div>
                 ))}
              </div>
            </div>
            <div className="w-full md:w-1/2">
               {t.edu.items.map((edu, i) => (
                 <div key={i} className="edu-card min-h-[80vh] flex flex-col justify-center p-8 md:p-16 border-b border-brand-blue/10 last:border-0">
                    <span className="font-mono text-brand-accent mb-4 block">0{i+1}</span>
                    <h3 className="text-3xl md:text-4xl font-bold text-brand-blue mb-2">{edu.title}</h3>
                    <div className="flex gap-4 font-mono text-xs uppercase text-brand-blue/60 mb-8"><span>{edu.place}</span><span>•</span><span>{edu.year}</span></div>
                    <p className="text-brand-blue/80 text-lg leading-relaxed">{edu.desc}</p>
                 </div>
               ))}
            </div>
          </section>
        );
      };

      const NeuralSkillGraph = () => {
        const { t } = useContext(LanguageContext);
        const [activeCategory, setActiveCategory] = useState(null);
        const nodes = [
          { id: 'core', label: t.skills.nodes.core, type: 'root', x: 50, y: 50 },
          { id: 'dl', label: t.skills.nodes.dl, type: 'hub', x: 20, y: 30, icon: <Brain size={20} /> },
          { id: 'quant', label: t.skills.nodes.quant, type: 'hub', x: 80, y: 30, icon: <BarChart3 size={20} /> },
          { id: 'eng', label: t.skills.nodes.eng, type: 'hub', x: 50, y: 80, icon: <Terminal size={20} /> },
          { id: 'pytorch', label: t.skills.nodes.pytorch, type: 'leaf', parent: 'dl', x: 10, y: 15 },
          { id: 'rl', label: t.skills.nodes.rl, type: 'leaf', parent: 'dl', x: 30, y: 10 },
          { id: 'timesnet', label: t.skills.nodes.timesnet, type: 'leaf', parent: 'dl', x: 5, y: 40 },
          { id: 'automl', label: t.skills.nodes.automl, type: 'leaf', parent: 'dl', x: 35, y: 45 },
          { id: 'backtest', label: t.skills.nodes.backtest, type: 'leaf', parent: 'quant', x: 70, y: 10 },
          { id: 'stats', label: t.skills.nodes.stats, type: 'leaf', parent: 'quant', x: 90, y: 15 },
          { id: 'risk', label: t.skills.nodes.risk, type: 'leaf', parent: 'quant', x: 65, y: 40 },
          { id: 'python', label: t.skills.nodes.python, type: 'leaf', parent: 'eng', x: 30, y: 75 },
          { id: 'pandas', label: t.skills.nodes.pandas, type: 'leaf', parent: 'eng', x: 70, y: 75 },
          { id: 'numba', label: t.skills.nodes.numba, type: 'leaf', parent: 'eng', x: 40, y: 95 },
          { id: 'scikit', label: t.skills.nodes.scikit, type: 'leaf', parent: 'eng', x: 60, y: 95 },
        ];
        const connections = [{ from: 'core', to: 'dl' }, { from: 'core', to: 'quant' }, { from: 'core', to: 'eng' }, ...nodes.filter(n => n.type === 'leaf').map(n => ({ from: n.parent, to: n.id }))];
        useGSAP(() => { gsap.to('.neural-node', { y: "random(-10, 10)", x: "random(-5, 5)", duration: "random(2, 4)", repeat: -1, yoyo: true, ease: "sine.inOut", stagger: { amount: 1.5, from: "center" } }); }, []);

        return (
          <div className="relative w-full aspect-[4/3] md:aspect-[2/1] bg-brand-cream rounded-3xl overflow-hidden border border-brand-blue/10 my-12 shadow-inner">
             <div className="absolute inset-0 opacity-[0.03]" style={{ backgroundImage: 'radial-gradient(#0A1245 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
             <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
               {connections.map((conn, i) => {
                 const s = nodes.find(n => n.id === conn.from); const e = nodes.find(n => n.id === conn.to);
                 const active = activeCategory && (conn.from === activeCategory || conn.to === activeCategory || (activeCategory === 'core' && conn.from === 'core'));
                 return (<line key={i} x1={`${s.x}%`} y1={`${s.y}%`} x2={`${e.x}%`} y2={`${e.y}%`} stroke={active ? "#2A45C2" : "#0A1245"} strokeWidth={active ? 2 : 1} strokeOpacity={active ? 0.6 : 0.1} className="neural-line" />);
               })}
             </svg>
             {nodes.map((node) => {
               const active = activeCategory === node.id || (activeCategory && nodes.find(n => n.id === activeCategory)?.type === 'hub' && (node.parent === activeCategory || (activeCategory === node.id) || (node.id === 'core'))) || (activeCategory === 'core' && node.type === 'hub');
               return (
                 <div key={node.id} className={`neural-node absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-10 flex flex-col items-center justify-center ${node.type === 'root' ? 'w-24 h-24 bg-brand-blue text-brand-cream z-20 font-bold text-xs' : node.type === 'hub' ? 'w-16 h-16 bg-white border border-brand-blue/10 hover:border-brand-accent' : 'px-3 py-1 bg-white/80 text-[10px]'} rounded-full transition-all duration-300 ${active ? 'scale-110 shadow-xl opacity-100 grayscale-0' : 'opacity-70 grayscale'}`} style={{ left: `${node.x}%`, top: `${node.y}%` }} onMouseEnter={() => setActiveCategory(node.id)} onMouseLeave={() => setActiveCategory(null)}>
                    {node.type === 'root' ? node.label : node.type === 'hub' ? (<div className="flex flex-col items-center gap-1"><div className={active ? 'text-brand-accent' : 'text-brand-blue'}>{node.icon}</div><span className="text-[8px] font-mono uppercase font-bold">{node.label}</span></div>) : (<span className="font-mono font-medium whitespace-nowrap">{node.label}</span>)}
                 </div>
               );
             })}
          </div>
        );
      };

      const CertificationsAndSkills = () => {
        const { t, lang } = useContext(LanguageContext);
        const certs = [
          { name: "Deep Learning Specialization", issuer: "DeepLearning.AI", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e5/DeepMind_New_Logo.svg", link: "https://www.coursera.org/account/accomplishments/specialization/7ND7TBWJMWN6" },
          { name: "Machine Learning Specialization", issuer: "Stanford University", logo: "https://upload.wikimedia.org/wikipedia/commons/4/4b/Stanford_S_logo.svg", link: "https://www.coursera.org/account/accomplishments/specialization/EHJNK64CH2KH" },
          { name: "Financial Markets", issuer: "Yale University", logo: "https://upload.wikimedia.org/wikipedia/commons/0/07/Yale_University_Shield_1.svg", link: "https://www.coursera.org/account/accomplishments/verify/GXI9YC44R2E2" }
        ];

        return (
          <section id="expertise" className="bg-brand-cream py-32 px-6">
             <div className="flex justify-between items-end mb-20 border-b border-brand-blue/10 pb-8">
               <h2 className="text-4xl md:text-6xl font-bold text-brand-blue tracking-tighter">{t.skills.title[0]}<br/>{t.skills.title[1]}</h2>
               <div className="hidden md:block font-mono text-xs uppercase text-brand-blue/50">{t.skills.subtitle}</div>
             </div>
             <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-32">
               {certs.map((c, i) => (
                 <a href={c.link} target="_blank" key={i} className="cert-card group relative min-h-[350px] border border-brand-blue/10 rounded-2xl overflow-hidden flex flex-col justify-between p-8 hover:border-brand-accent/40 transition-all duration-500 bg-white/50">
                    <div className="bg-layer absolute inset-0 flex items-center justify-center pointer-events-none"><img src={c.logo} className="w-32 h-32 object-contain" alt={c.issuer} /></div>
                    <div className="relative z-10 flex justify-between items-start"><span className="font-mono text-[10px] uppercase text-brand-blue/40">Credential</span><ExternalLink size={16} className="text-brand-accent opacity-0 group-hover:opacity-100" /></div>
                    <div className="relative z-10"><span className="block font-mono text-xs text-brand-accent mb-2">{c.issuer}</span><h3 className="text-2xl font-bold text-brand-blue leading-tight">{c.name}</h3></div>
                 </a>
               ))}
             </div>
             <div className="pt-16 border-t border-brand-blue/10">
                <div className="flex justify-between items-center mb-8"><h3 className="font-mono text-xs uppercase tracking-widest text-brand-blue/60">{t.skills.graphTitle}</h3><span className="font-mono text-[10px] uppercase text-brand-accent animate-pulse">{t.skills.graphLabel}</span></div>
                <NeuralSkillGraph />
                <div className="mt-20 flex flex-wrap gap-6 justify-center">
                  <CVButtonGroup variant="light" />
                </div>
             </div>
          </section>
        );
      };

      const Footer = () => {
        const { t, lang } = useContext(LanguageContext);
        const footerRef = useRef(null);
        useGSAP(() => { gsap.from('.footer-content', { yPercent: -50, opacity: 0, scrollTrigger: { trigger: footerRef.current, start: "top bottom", end: "bottom bottom", scrub: true } }); }, [lang]);

        return (
          <footer ref={footerRef} className="bg-brand-blue text-brand-cream pt-32 pb-12 px-6 relative overflow-hidden">
             <div className="absolute top-0 left-0 w-full h-full pointer-events-none opacity-5"><span className="text-[25vw] font-bold leading-none select-none absolute top-[-5vw] left-[-2vw]">GONZALO</span></div>
             <div className="footer-content relative z-10 container mx-auto">
               <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 mb-32">
                 <div><span className="font-mono text-xs tracking-widest opacity-40 mb-6 block">{t.footer.locationLabel}</span><p className="text-lg flex items-center gap-2"><MapPin size={18} /> {t.footer.location}</p></div>
                 <div><span className="font-mono text-xs tracking-widest opacity-40 mb-6 block">{t.footer.contactLabel}</span><a href="mailto:gonzalopilar2005@gmail.com" className="text-lg hover:text-brand-accent transition-colors block break-all">gonzalopilar2005@gmail.com</a></div>
                 <div className="lg:col-span-2">
                    <span className="font-mono text-xs tracking-widest opacity-40 mb-6 block">{t.footer.aboutLabel}</span>
                    <p className="text-brand-cream/70 text-lg leading-relaxed">{t.footer.about}</p>
                 </div>
               </div>
               <div className="flex flex-col md:flex-row justify-between items-end pt-12 border-t border-brand-cream/10">
                 <h2 className="text-[12vw] leading-[0.8] font-bold uppercase mb-8 md:mb-0">Pilar<br/>Sánchez</h2>
                 <div className="flex gap-8 font-mono text-xs opacity-60">
                   <a href="https://github.com/goco41" target="_blank" className="hover:opacity-100 flex items-center gap-2"><Github size={14} /> GitHub</a>
                   <a href="mailto:gonzalopilar2005@gmail.com" className="hover:opacity-100 flex items-center gap-2"><Mail size={14} /> Email</a>
                 </div>
               </div>
             </div>
          </footer>
        );
      };

      const App = () => {
        const [lang, setLang] = useState('es');
        const [lenis, setLenis] = useState(null);
        useEffect(() => {
          const l = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), direction: 'vertical', smooth: true });
          function raf(time) { l.raf(time); requestAnimationFrame(raf); }
          requestAnimationFrame(raf); setLenis(l); return () => l.destroy();
        }, []);

        return (
          <LanguageContext.Provider value={{ lang, setLang, t: TRANSLATIONS[lang], lenis }}>
            <div className="w-full">
              <Header />
              <main><Hero /><Intro /><HorizontalProjects /><EducationVertical /><CertificationsAndSkills /></main>
              <Footer />
            </div>
          </LanguageContext.Provider>
        );
      };

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
