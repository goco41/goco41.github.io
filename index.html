<script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // --- THEME CONFIGURATION ---
    const themes = {

            isDark: true,
            colors: {

                accent: '#7c4dff',
                accentHover: '#6200ea',
                textMain: 'text-white',
                textSecondary: 'text-gray-400',
                surface: 'bg-white/[0.03]',
                border: 'border-white/10',
                navbarScrolled: 'bg-[#0b0c26]/85',
                footerBg: 'bg-[#08091f]'
            }
        },
        'dark-blue': {
            name: 'dark-blue',
            isDark: true,
            colors: {
                background: 'radial-gradient(circle at 50% 10%, #1e3a8a 0%, #0f172a 60%)',
                accent: '#3b82f6',
                accentHover: '#2563eb',
                textMain: 'text-white',
                textSecondary: 'text-slate-400',

                border: 'border-slate-700/50',
                navbarScrolled: 'bg-[#0f172a]/85',
                footerBg: 'bg-slate-950'
            }
        },
        'light-purple': {
            name: 'light-purple',
            isDark: false,
            colors: {
                background: 'radial-gradient(circle at 50% 10%, #ede9fe 0%, #f3f4f6 60%)',
                accent: '#7c4dff',
                accentHover: '#6200ea',
                textMain: 'text-gray-900',
                textSecondary: 'text-gray-600',
                surface: 'bg-white',
                border: 'border-gray-200',
                navbarScrolled: 'bg-white/90',
                footerBg: 'bg-[#0b0c26]'
            }
        },
        'light-blue': {
            name: 'light-blue',
            isDark: false,
            colors: {
                background: 'radial-gradient(circle at 50% 10%, #eff6ff 0%, #f8fafc 60%)',
                accent: '#2563eb',
                accentHover: '#1d4ed8',
                textMain: 'text-slate-900',
                textSecondary: 'text-slate-600',
                surface: 'bg-white',
                border: 'border-slate-200',
                navbarScrolled: 'bg-white/90',
                footerBg: 'bg-slate-900'
            }
        }
    };

    const ThemeContext = createContext();

    const ThemeProvider = ({ children }) => {
        const [currentThemeName, setCurrentThemeName] = useState('dark-purple');
        const theme = themes[currentThemeName];

        useEffect(() => {
            document.body.style.background = theme.colors.background;
            document.body.style.minHeight = '100vh';
            document.body.style.color = theme.isDark ? 'white' : '#1f2937';
        }, [theme]);

        return (
            <ThemeContext.Provider value={{ theme, setTheme: setCurrentThemeName }}>
                {children}
            </ThemeContext.Provider>
        );
    };

    const useTheme = () => useContext(ThemeContext);

    // --- COMPONENTS ---

    const ThemeSwitcher = () => {
        const { setTheme, theme } = useTheme();

        const buttons = [
            { id: 'dark-purple', label: 'Dark Purple', bg: 'bg-[#0b0c26]', border: 'border-[#7c4dff]' },
            { id: 'dark-blue', label: 'Dark Blue', bg: 'bg-[#0f172a]', border: 'border-[#3b82f6]' },
            { id: 'light-purple', label: 'Light Purple', bg: 'bg-[#f3f4f6]', border: 'border-[#7c4dff]' },
            { id: 'light-blue', label: 'Light Blue', bg: 'bg-[#f8fafc]', border: 'border-[#2563eb]' },
        ];

        return (
            <div className="fixed top-5 right-5 z-[60] flex gap-2 p-2 bg-white/10 backdrop-blur-md rounded-full border border-white/20 shadow-lg">
                {buttons.map((btn) => (
                    <button
                        key={btn.id}
                        onClick={() => setTheme(btn.id)}
                        title={btn.label}
                        className={`w-6 h-6 rounded-full ${btn.bg} border-2 ${btn.border} ${
                            theme.name === btn.id ? 'scale-125 ring-2 ring-white shadow-lg' : 'hover:scale-110 opacity-70 hover:opacity-100'
                        } transition-all duration-300`}
                    />
                ))}
            </div>
        );
    };

    const Navbar = () => {
        const [isScrolled, setIsScrolled] = useState(false);
        const { theme } = useTheme();

        useEffect(() => {
            const handleScroll = () => {
                setIsScrolled(window.scrollY > 20);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const navClasses = isScrolled
            ? `${theme.colors.navbarScrolled} backdrop-blur-md border-b ${theme.colors.border} shadow-sm`
            : 'bg-transparent';

        return (
            <nav className={`fixed top-0 w-full z-50 py-4 transition-all duration-500 ${navClasses}`}>
                <div className="max-w-[1100px] mx-auto flex justify-center items-center px-5">
                    <ul className="hidden md:flex gap-8">
                        {['Inicio', 'Proyectos', 'Curriculum', 'Referencias', 'Contacto'].map((item) => {
                            const href = item === 'Inicio' ? '#home' : `#${item.toLowerCase().replace('referencias', 'testimonials').replace('curriculum', 'cv')}`;
                            return (
                                <li key={item}>
                                    <a 
                                        href={href} 
                                        className={`${theme.colors.textSecondary} font-medium text-sm transition-colors hover:opacity-100`}
                                        style={{ '--hover-color': theme.colors.accent }}
                                        onMouseEnter={(e) => e.currentTarget.style.color = theme.colors.accent}
                                        onMouseLeave={(e) => e.currentTarget.style.color = ''}
                                    >
                                        {item}
                                    </a>
                                </li>
                            );
                        })}
                    </ul>
                    <div className="md:hidden text-sm">
                        <span className="font-bold" style={{ color: theme.colors.accent }}>GPS</span> <span className={theme.colors.textMain}>Portfolio</span>
                    </div>
                </div>
            </nav>
        );
    };

    const Hero = () => {
        const { theme } = useTheme();
        return (
            <section id="home" className={`pt-40 pb-20 px-5 text-center border-b ${theme.colors.border} transition-colors duration-500`}>
                <p style={{ color: theme.colors.accent }} className="text-xl font-semibold mb-6 tracking-wide transition-colors duration-500">
                    ML / DATA SCIENCE / QUANT
                </p>
                <h1 className={`text-5xl md:text-7xl font-bold mb-4 tracking-tight ${theme.colors.textMain} transition-colors duration-500`}>
                    <span 
                        style={{ 
                            backgroundImage: `linear-gradient(to right, ${theme.isDark ? '#fff' : '#111'}, ${theme.colors.accent}, ${theme.colors.accentHover})`
                        }}
                        className="text-transparent bg-clip-text bg-[length:200%_auto] animate-[gradient_3s_ease_infinite]"
                    >
                        Gonzalo Pilar Sánchez
                    </span>
                </h1>
                <p className={`max-w-2xl mx-auto mb-8 text-lg leading-relaxed ${theme.colors.textSecondary} transition-colors duration-500`}>
                    Desarrollador enfocado en Machine Learning, Data Science y Finanzas Cuantitativas. 
                    Busco transformar datos complejos en decisiones financieras y herramientas útiles, 
                    priorizando siempre el rigor.
                </p>
                <div className="flex justify-center gap-6 text-2xl md:text-3xl mb-10 text-gray-400 transition-colors duration-500">
                    {['fab fa-python', 'fas fa-database', 'fas fa-chart-line', 'fas fa-brain', 'fas fa-code'].map((iconClass, idx) => (
                        <i 
                            key={idx}
                            className={`${iconClass} hover:-translate-y-1 transition-all duration-300 cursor-pointer`}
                            onMouseEnter={(e) => e.currentTarget.style.color = theme.colors.accent}
                            onMouseLeave={(e) => e.currentTarget.style.color = ''}
                        ></i>
                    ))}
                </div>
                <div className="flex flex-col sm:flex-row justify-center gap-5 flex-wrap">
                    <a 
                        href="#projects" 
                        style={{ backgroundColor: theme.colors.accent, boxShadow: `0 4px 15px ${theme.colors.accent}66` }}
                        className="px-8 py-3 rounded-full text-white font-semibold hover:-translate-y-0.5 transition-all hover:brightness-110"
                    >
                        Ver Proyectos
                    </a>
                    <a 
                        href="assets/cv/CV-Gonzalo-Pilar-Sánchez-2026.pdf" 
                        download 
                        style={{ borderColor: theme.colors.accent, color: theme.colors.accent }}
                        className="px-8 py-3 rounded-full border-2 font-semibold hover:bg-white/10 transition-all flex items-center justify-center gap-2"
                    >
                        <i className="fas fa-file-download"></i> Descargar CV
                    </a>
                    <a 
                        href="assets/cv/CV-Gonzalo-Pilar-Sánchez-2026.pdf" 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        style={{ borderColor: theme.colors.accent, color: theme.colors.accent }}
                        className="px-8 py-3 rounded-full border-2 font-semibold hover:bg-white/10 transition-all flex items-center justify-center gap-2"
                    >
                        <i className="fas fa-eye"></i> Visualizar CV
                    </a>
                </div>
            </section>
        );
    };

    const Philosophy = () => {
        const { theme } = useTheme();
        return (
            <section className={`py-20 border-b ${theme.colors.border} transition-colors duration-500`}>
                <div className={`max-w-3xl mx-auto text-center ${theme.colors.surface} border ${theme.colors.border} rounded-2xl p-8 shadow-sm transition-colors duration-500`}>
                    <h3 className={`text-2xl font-bold mb-4 ${theme.colors.textMain}`}>Mi filosofía</h3>
                    <p className={`${theme.colors.textSecondary} leading-relaxed`}>
                        Me mueve la curiosidad intelectual y el deseo de entender cómo funcionan realmente los modelos. Creo de forma firme que como decía Thomas Garrity "Las funciones describen el mundo", pero con un giro, creo que "Las funciones y la estadística <em>modelan</em> el mundo". Me gusta entender <em>por qué</em> funcionan los modelos y verles el sentido. Me considero una persona constante y risueña, con vocación para explicar conceptos complejos y trabajar en equipo.
                    </p>
                </div>
            </section>
        );
    };

    const projectsData = [
        {
            id: 'proj-1',
            category: 'Machine Learning / Small Data',
            title: 'Predicción de Afinidad Cinematográfica',
            tags: ['Python', 'APIs', 'AutoML', 'Feature Engineering'],
            originTitle: 'El Origen',
            teaser: 'Todo empezó con una web llamada Palomitacas...',
            content: (
                <React.Fragment>
                    <p>Hace años empecé a usar una web llamada Palomitacas. La elegí porque tenía una función que me encantaba: me decía qué nota le daría yo a una película antes de verla. Un día, esa función desapareció sin explicación. En aquel entonces, yo estaba empezando en el análisis de datos y ML, así que intenté replicarla por mi cuenta. Fracasé estrepitosamente y lo dejé aparcado.</p>
                    <p>Hace unos meses decidí retomar ese reto personal para ver cuánto había mejorado. Sabía que mi base de datos era ínfima y que extraer señal de ahí sería como intentar 'matar moscas a cañonazos', pero me daba igual: quería exprimir cada dato y ver hasta dónde podía llegar. No buscaba un modelo perfecto ni métricas de libro, buscaba una herramienta que me guiase.</p>
                    <p>El resultado es un proyecto de Machine Learning en Python que integra APIs, técnicas de AutoML y modelos personalizados. Es una solución humilde, pero que funciona y cumple su objetivo. Espero volver a este dataset en el futuro con más conocimientos y ver cómo siguen evolucionando las métricas.</p>
                </React.Fragment>
            ),
            techSheet: {
                problem: 'Dataset personal muy pequeño y ruidoso (Small Data). Necesidad de predecir gustos subjetivos.',
                solution: 'Pipeline de enriquecimiento con OMDb API e ingeniería de características personalizada (Positional Multi-Label Encoder).',
                result: 'Modelo funcional robusto a diferentes semillas. Creación de métrica personalizada de estabilidad.'
            },
            githubUrl: 'https://github.com/goco41/ML-DS-para-Peliculas'
        },
        {
            id: 'proj-2',
            category: 'Finanzas Cuantitativas / Infraestructura',
            title: 'Validación de Alphas en Trading',
            tags: ['Numba', 'Backtesting Riguroso', 'CPCV', 'Estadística'],
            originTitle: 'El Origen',
            teaser: 'Un icono de MetaTrader lo cambió todo...',
            content: (
                <React.Fragment>
                    <p>Prácticamente desde que empecé con Python, sabía que quería aplicarlo a las finanzas y los datos, pero era consciente de su complejidad. Por ello, decidí posponerlo para centrarme en mis estudios y la Selectividad. Todo cambió un día charlando con mi Jefe de Estudios; vi en su ordenador el icono de MetaTrader 5 y no pude evitar preguntar. Me explicó que tenía una estrategia automatizada para el EURUSD, pero que le había costado años desarrollarla y no pensaba desvelar su 'secreto' a nadie.</p>
                    <p>Ese día volví a casa con un reto personal: yo también quería construir algo así. Él era alguien con carrera, máster y años de experiencia, pero aun así acepté el desafío. Pasé tardes, días y semanas enteras experimentando con Python, intercalando mis estudios con la búsqueda de esa idea ganadora y otros proyectos con python. Fracasé una y otra vez. Cada vez que creía tener algo que funcionaba, descubría rastros de data leakage o contaminación de datos. En cuanto corregía el error, la rentabilidad se esfumaba.</p>
                    <p>Tras muchos intentos, dejé de intentar ignorar la dura realidad: me faltaban Alphas (señales predictivas reales). Sabía que 'si entra basura, sale basura'. Por eso, con la estadística en la mano, decidí centrarme en construir el pipeline que me ayudaría en el proceso.</p>
                    <p>Emprendí este proyecto sabiendo que los indicadores convencionales están muy explotados y que las probabilidades de éxito inmediato eran bajas. Sin embargo, el resultado fue un éxito en lo que realmente importa: he creado una infraestructura robusta para testear ideas con rigor científico y separar, por fin, la suerte de la verdadera ventaja estadística. Ahora no solo tengo código; tengo un método sólido para validar cualquier Alpha que surja en el futuro.</p>
                </React.Fragment>
            ),
            techSheet: {
                problem: 'Alto riesgo de overfitting (p-hacking) al minar estrategias de trading.',
                solution: 'Implementación de validación cruzada combinatoria (CPCV) y ajuste estadístico (Deflated Sharpe Ratio) usando Numba para alto rendimiento.',
                result: 'Infraestructura capaz de rechazar estrategias falsas positivas y validar Alphas con rigor científico.'
            },
            githubUrl: 'https://github.com/goco41/ind-4-alphas/tree/main'
        },
        {
            id: 'proj-3',
            category: 'Deep Reinforcement Learning / Research',
            title: 'Réplica Crítica: SRDDQN + TimesNet',
            tags: ['PyTorch', 'Computer Vision', 'Research Reproduction'],
            originTitle: 'El Origen',
            teaser: '¿Por qué reinventar la rueda?',
            content: (
                <React.Fragment>
                    <p>Tras dedicar mucho tiempo a intentar diseñar un sistema propio que fuese robusto, llegué a una conclusión lógica: existen investigadores y mentes brillantes que ya han publicado soluciones avanzadas. ¿Por qué no apoyarme en su experiencia? Así fue como, tras una búsqueda intensiva de literatura técnica, descubrí el paper SRDDQN.</p>
                    <p>Lo que me cautivó de este estudio fue el uso de TimesNet. Me pareció fascinante encontrar una arquitectura que tratase las series temporales como imágenes mediante la Transformada de Fourier, que es, casualmente, uno de mis conceptos matemáticos favoritos. La posibilidad de aplicar visión por computador al análisis financiero, sumada a un mecanismo de auto-recompensa dinámica (donde la IA decide cómo premiar su propio aprendizaje), me motivó a implementar el proyecto por completo.</p>
                    <p>El proceso fue exigente: desde el diseño de diagramas de flujo hasta la reconstrucción de los gráficos de rendimiento. Sin embargo, la réplica también me aportó una lección valiosa sobre el rigor en la investigación. El paper original reportaba rentabilidades y Ratios de Sharpe extraordinarios que, en mi implementación, no se alcanzaron.</p>
                    <p>Al analizar las causas, identifiqué factores críticos: el paper utiliza un split simple de train y test, lo que facilita un sobreajuste (overfitting) a este último. Además, con casi total seguridad, el estudio omite el impacto del spread entre Bid y Ask. En mi réplica, al ser más estricto con los costes reales de ejecución, los resultados fueron más humildes, pero también más honestos y cercanos a la realidad del mercado. A pesar de la discrepancia en las métricas, este proyecto ha sido una de las experiencias de aprendizaje más enriquecedoras que he tenido.</p>
                </React.Fragment>
            ),
            techSheet: {
                problem: 'Reproducibilidad de papers académicos y adaptación a entornos de mercado realistas.',
                solution: 'Implementación de TimesNet (Visión 2D de series temporales) y un agente de RL híbrido con simulación de costes reales.',
                result: 'Réplica crítica que desveló sesgos en el estudio original y propuso un modelo más realista.'
            },
            githubUrl: 'https://github.com/goco41/SRDDQN4tr'
        }
    ];

                    </h2>

                    return (
                        <div key={project.id} className={`border rounded-2xl p-6 md:p-10 mb-16 transition-all duration-300 ${cardClasses}`} style={cardStyle}>

                                <h3 className={`text-2xl md:text-3xl ${theme.colors.textMain} font-bold mb-3`}>{project.title}</h3>
                                <div className="flex flex-wrap gap-2">

                                        <span key={tag} className="text-xs md:text-sm px-3 py-1 rounded border" style={{ backgroundColor: `${theme.colors.accent}1A`, color: theme.colors.accent, borderColor: `${theme.colors.accent}33` }}>{tag}</span>
                                    ))}
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row flex-wrap md:justify-between items-start gap-y-8 md:gap-y-0">
                                <div className={`flex flex-col w-full transition-[width] duration-500 ease-in-out ${leftColClasses}`}>
                                    <h4 className={`${theme.colors.textMain} text-lg mb-5 flex items-center gap-2 border-l-4 pl-3 font-semibold`} style={{ borderColor: theme.colors.accent }}>
                                        <i className={`fas fa-book-open ${theme.colors.textSecondary}`}></i> {project.originTitle}

                                        <span className={`${theme.colors.textSecondary} group-hover:${theme.colors.textMain} text-base md:text-lg transition-colors`}>{project.teaser}</span>
                                        <i className={`fas fa-chevron-down transition-transform duration-500 ${chevronClasses}`}></i>
                                    </div>
                                    <div className={`overflow-hidden transition-all duration-500 ease-in-out ${textContentClasses}`}>
                                        <div className={`${theme.colors.textSecondary} text-justify text-base leading-relaxed space-y-4 pt-5`}>{project.content}</div>
                                    </div>
                                </div>
                                <div className={`w-full transition-[width,margin,opacity] duration-500 ease-in-out ${rightColClasses}`}>
                                    <div className={`w-full pt-6 border-t ${theme.colors.border} md:pt-0 md:border-t-0`}>
                                        <h4 className={`${theme.colors.textMain} text-lg mb-5 flex items-center gap-2 border-l-4 pl-3 font-semibold`} style={{ borderColor: theme.colors.accent }}>
                                            <i className={`fas fa-microchip ${theme.colors.textSecondary}`}></i> Ficha Técnica
                                        </h4>

                                            <li className={`grid grid-cols-[25px_1fr] ${theme.colors.textSecondary} text-sm md:text-base`}><i className="fas fa-exclamation-circle text-amber-500 mt-1.5"></i><div><span className={`${theme.colors.textMain} font-bold block`}>Problema:</span>{project.techSheet.problem}</div></li>
                                            <li className={`grid grid-cols-[25px_1fr] ${theme.colors.textSecondary} text-sm md:text-base`}><i className="fas fa-tools mt-1.5" style={{ color: theme.colors.accent }}></i><div><span className={`${theme.colors.textMain} font-bold block`}>Solución:</span>{project.techSheet.solution}</div></li>
                                            <li className={`grid grid-cols-[25px_1fr] ${theme.colors.textSecondary} text-sm md:text-base`}><i className="fas fa-check-circle text-emerald-500 mt-1.5"></i><div><span className={`${theme.colors.textMain} font-bold block`}>Resultado:</span>{project.techSheet.result}</div></li>
                                        </ul>
                                        <a href={project.githubUrl} target="_blank" rel="noreferrer" className="mt-6 inline-block px-5 py-2 border-2 text-sm rounded-full hover:bg-white/5 transition-colors font-semibold" style={{ borderColor: theme.colors.accent, color: theme.colors.accent }}>Ver en GitHub</a>
