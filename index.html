            xTo((clientX - (left + width / 2)) * 0.35);
            yTo((clientY - (top + height / 2)) * 0.35);
          };
          const mouseLeave = () => { xTo(0); yTo(0); };
          el.addEventListener("mousemove", mouseMove);
          el.addEventListener("mouseleave", mouseLeave);
          return () => { el.removeEventListener("mousemove", mouseMove); el.removeEventListener("mouseleave", mouseLeave); };
        }, []);

                      <div className="absolute left-[15px] md:left-1/2 w-4 h-4 rounded-full border-2 border-brand-blue bg-brand-cream -translate-x-1/2 mt-[28px] md:mt-0 z-10 group-hover:bg-brand-accent group-hover:border-brand-accent transition-colors duration-300">
                        <div className="absolute inset-0 bg-brand-accent rounded-full animate-ping opacity-0 group-hover:opacity-20"></div>
                      </div>

                      <div className="hidden md:block w-[45%]"></div>
                      
                      <div className={`w-full md:w-[45%] pl-12 md:pl-0 ${i % 2 === 0 ? 'md:pr-12 md:text-right' : 'md:pl-12 text-left'}`}>
                        <div className="bg-white p-6 md:p-8 rounded-2xl border border-brand-blue/10 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative overflow-hidden group-hover:border-brand-blue/20">
                          <div className={`absolute top-0 w-1 h-full bg-brand-accent opacity-0 group-hover:opacity-100 transition-opacity duration-300 ${i % 2 === 0 ? 'right-0' : 'left-0'}`}></div>
                          
                          <div className={`flex flex-wrap gap-2 font-mono text-[10px] uppercase text-brand-blue/60 mb-4 ${i % 2 === 0 ? 'md:justify-end' : 'justify-start'}`}>
                            <span className="bg-brand-cream px-3 py-1 rounded-full border border-brand-blue/5">{edu.year}</span>
                            <span className="bg-brand-accent/10 text-brand-accent px-3 py-1 rounded-full font-bold border border-brand-accent/10">{edu.place}</span>
                          </div>
                          
                          <h3 className="text-xl md:text-2xl font-bold text-brand-blue mb-3 tracking-tight">{edu.title}</h3>
                          <p className="text-brand-blue/80 text-sm md:text-base leading-relaxed">{edu.desc}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="relative h-32 mt-16 md:mt-24 edu-badge">
                  <div className="absolute left-[15px] md:left-1/2 -translate-x-1/2 top-0 bg-brand-cream py-4 z-10">
                    <CircularText text={t.edu.badgeText} />
                  </div>
                </div>

              </div>
            </div>
          </section>
        );
      };

      const NeuralSkillGraph = () => {
        const { t } = useContext(LanguageContext);
        const [activeCategory, setActiveCategory] = useState(null);
        const nodes = [
          { id: 'core', label: t.skills.nodes.core, type: 'root', x: 50, y: 50 },
          { id: 'dl', label: t.skills.nodes.dl, type: 'hub', x: 20, y: 30, icon: <Brain size={20} /> },
          { id: 'quant', label: t.skills.nodes.quant, type: 'hub', x: 80, y: 30, icon: <BarChart3 size={20} /> },
          { id: 'eng', label: t.skills.nodes.eng, type: 'hub', x: 50, y: 80, icon: <Terminal size={20} /> },
          { id: 'pytorch', label: t.skills.nodes.pytorch, type: 'leaf', parent: 'dl', x: 10, y: 15 },
          { id: 'rl', label: t.skills.nodes.rl, type: 'leaf', parent: 'dl', x: 30, y: 10 },
          { id: 'timesnet', label: t.skills.nodes.timesnet, type: 'leaf', parent: 'dl', x: 5, y: 40 },
          { id: 'automl', label: t.skills.nodes.automl, type: 'leaf', parent: 'dl', x: 35, y: 45 },
          { id: 'backtest', label: t.skills.nodes.backtest, type: 'leaf', parent: 'quant', x: 70, y: 10 },
          { id: 'stats', label: t.skills.nodes.stats, type: 'leaf', parent: 'quant', x: 90, y: 15 },
          { id: 'risk', label: t.skills.nodes.risk, type: 'leaf', parent: 'quant', x: 65, y: 40 },
          { id: 'python', label: t.skills.nodes.python, type: 'leaf', parent: 'eng', x: 30, y: 75 },
          { id: 'pandas', label: t.skills.nodes.pandas, type: 'leaf', parent: 'eng', x: 70, y: 75 },
          { id: 'numba', label: t.skills.nodes.numba, type: 'leaf', parent: 'eng', x: 40, y: 95 },
          { id: 'scikit', label: t.skills.nodes.scikit, type: 'leaf', parent: 'eng', x: 60, y: 95 },
        ];
        const connections = [{ from: 'core', to: 'dl' }, { from: 'core', to: 'quant' }, { from: 'core', to: 'eng' }, ...nodes.filter(n => n.type === 'leaf').map(n => ({ from: n.parent, to: n.id }))];
        useGSAP(() => { gsap.to('.neural-node', { y: "random(-10, 10)", x: "random(-5, 5)", duration: "random(2, 4)", repeat: -1, yoyo: true, ease: "sine.inOut", stagger: { amount: 1.5, from: "center" } }); }, []);

        return (
          <div className="relative w-full aspect-[4/3] md:aspect-[2/1] bg-white rounded-3xl overflow-hidden border border-brand-blue/10 my-8 shadow-[inset_0_0_100px_rgba(10,18,69,0.02)]">
             <div className="absolute top-4 left-6 font-mono text-[10px] text-brand-blue/30 z-10 uppercase">Data_Viz: Interactive Nodes</div>
             <div className="absolute inset-0 opacity-[0.03]" style={{ backgroundImage: 'radial-gradient(#0A1245 1.5px, transparent 1.5px)', backgroundSize: '30px 30px' }}></div>
             <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
               {connections.map((conn, i) => {
                 const s = nodes.find(n => n.id === conn.from); const e = nodes.find(n => n.id === conn.to);
                 const active = activeCategory && (conn.from === activeCategory || conn.to === activeCategory || (activeCategory === 'core' && conn.from === 'core'));
                 return (<line key={i} x1={`${s.x}%`} y1={`${s.y}%`} x2={`${e.x}%`} y2={`${e.y}%`} stroke={active ? "#2A45C2" : "#0A1245"} strokeWidth={active ? 2 : 1} strokeOpacity={active ? 0.6 : 0.15} className="neural-line" />);
               })}
             </svg>
             {nodes.map((node) => {
               const active = activeCategory === node.id || (activeCategory && nodes.find(n => n.id === activeCategory)?.type === 'hub' && (node.parent === activeCategory || (activeCategory === node.id) || (node.id === 'core'))) || (activeCategory === 'core' && node.type === 'hub');
               return (
                 <div key={node.id} className={`neural-node absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-10 flex flex-col items-center justify-center ${node.type === 'root' ? 'w-24 h-24 bg-brand-blue text-brand-cream z-20 font-bold text-xs shadow-2xl ring-8 ring-brand-blue/10' : node.type === 'hub' ? 'w-16 h-16 bg-white border border-brand-blue/10 hover:border-brand-accent shadow-lg' : 'px-3 py-1.5 bg-white/90 backdrop-blur-sm border border-brand-blue/5 text-[10px] shadow-sm'} rounded-full transition-all duration-300 ${active ? 'scale-110 shadow-xl opacity-100 grayscale-0 ring-4 ring-brand-accent/20' : 'opacity-70 grayscale hover:grayscale-0'}`} style={{ left: `${node.x}%`, top: `${node.y}%` }} onMouseEnter={() => setActiveCategory(node.id)} onMouseLeave={() => setActiveCategory(null)}>
                    {node.type === 'root' ? node.label : node.type === 'hub' ? (<div className="flex flex-col items-center gap-1"><div className={active ? 'text-brand-accent' : 'text-brand-blue'}>{node.icon}</div><span className="text-[8px] font-mono uppercase font-bold">{node.label}</span></div>) : (<span className="font-mono font-medium whitespace-nowrap">{node.label}</span>)}
                 </div>
               );
             })}
          </div>
        );
      };

      const CertificationsAndSkills = () => {
        const { t, lang } = useContext(LanguageContext);
        const certs = [
          { name: "Deep Learning Specialization", issuer: "DeepLearning.AI", logo: "https://learn.deeplearning.ai/assets/dlai-logo.png", link: "https://www.coursera.org/account/accomplishments/specialization/7ND7TBWJMWN6" },
          { name: "Machine Learning Specialization", issuer: "Stanford University", logo: "https://upload.wikimedia.org/wikipedia/commons/6/68/Stanford_logo.png", link: "https://www.coursera.org/account/accomplishments/specialization/EHJNK64CH2KH" },
          { name: "Financial Markets", issuer: "Yale University", logo: "https://upload.wikimedia.org/wikipedia/commons/2/20/Yale_Logo.png", link: "https://www.coursera.org/account/accomplishments/verify/GXI9YC44R2E2" }
        ];

        return (
          <section id="expertise" className="bg-brand-cream bg-grid py-32 px-6">
             <div className="max-w-7xl mx-auto">
               <div className="flex justify-between items-end mb-20 border-b border-brand-blue/10 pb-8">
                 <div>
                   <span className="font-mono text-[10px] uppercase tracking-widest text-brand-blue/50 mb-4 block">03 / {t.skills.section}</span>
                   <h2 className="text-4xl md:text-6xl font-bold text-brand-blue tracking-tighter">
                     {t.skills.title[0]}<br/>
                     <span className="text-transparent stroke-text font-figtree" style={{ WebkitTextStroke: '1.5px #0A1245' }}>{t.skills.title[1]}</span>
                   </h2>
                 </div>
                 <div className="hidden md:block font-mono text-[10px] uppercase text-brand-blue/50 border border-brand-blue/10 px-4 py-2 rounded-full">{t.skills.subtitle}</div>
               </div>
               
               <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-32">
                 {certs.map((c, i) => (
                    <a href={c.link} target="_blank" rel="noopener noreferrer" key={i} className="cert-card group relative min-h-[350px] border border-brand-blue/10 rounded-3xl overflow-hidden flex flex-col justify-between p-8 hover:border-brand-accent/40 transition-all duration-500 bg-white/70 backdrop-blur-sm hover:shadow-2xl hover:shadow-brand-blue/5 hover:-translate-y-2">
                      <div className="bg-layer absolute inset-0 flex items-center justify-center pointer-events-none">
                        <img src={c.logo} className={`object-contain -translate-y-[20px] transition-transform duration-700 group-hover:scale-110 ${c.issuer === "DeepLearning.AI" ? "w-64 h-64" : c.issuer === "Stanford University" ? "w-48 h-48" : "w-32 h-32"}`} alt={c.issuer}/>
                      </div>
                      <div className="relative z-10 flex justify-between items-start">
                        <span className="font-mono text-[10px] uppercase text-brand-blue/50 bg-white/50 px-3 py-1 rounded-full border border-brand-blue/5">Credential</span>
                        <div className="w-8 h-8 rounded-full bg-white flex items-center justify-center border border-brand-blue/10 shadow-sm opacity-0 -translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
                          <ExternalLink size={14} className="text-brand-accent" />
                        </div>
                      </div>
                      <div className="relative z-10 bg-white/80 backdrop-blur-md p-4 rounded-xl border border-white">
                        <span className="block font-mono text-[10px] text-brand-accent mb-1">{c.issuer}</span>
                        <h3 className="text-xl font-bold text-brand-blue leading-tight">{c.name}</h3>
                      </div>
                   </a>
                 ))}
               </div>
               
               <div className="pt-24 border-t border-brand-blue/10 relative">
                  <div className="absolute top-24 left-1/2 -translate-x-1/2 font-mono text-[10rem] opacity-[0.02] font-bold pointer-events-none">MAP</div>
                  <div className="flex justify-between items-center mb-8">
                    <h3 className="font-mono text-xs uppercase tracking-widest text-brand-blue/60 flex items-center gap-3"><Cpu size={16}/> {t.skills.graphTitle}</h3>
                    <span className="font-mono text-[10px] uppercase text-brand-accent animate-pulse bg-brand-accent/10 px-3 py-1 rounded-full">{t.skills.graphLabel}</span>
                  </div>
                  <NeuralSkillGraph />
                  <div className="mt-24 mb-12 flex flex-col items-center">
                    <span className="font-mono text-[10px] uppercase text-brand-blue/40 mb-6 tracking-widest">[ END_OF_FILE ]</span>
                    <div className="flex flex-wrap gap-6 justify-center"><CVButtonGroup variant="light" /></div>
                  </div>
               </div>
             </div>
          </section>
        );
      };

      const Footer = () => {
        const { t, lang } = useContext(LanguageContext);
        const footerRef = useRef(null);
        
        useGSAP(() => {
          const tl = gsap.timeline({
            scrollTrigger: {
              trigger: footerRef.current,
              start: "top 85%",
            }
          });

          tl.fromTo('.footer-line', 
            { scaleX: 0 }, 
            { scaleX: 1, duration: 1, ease: 'power3.inOut', stagger: 0.2 }
          )
          .fromTo('.footer-item', 
            { y: 20, opacity: 0 }, 
            { y: 0, opacity: 1, duration: 0.8, stagger: 0.1, ease: 'power2.out' }, 
            "-=0.5"
          );
        }, [lang]);

        return (
          <footer ref={footerRef} className="relative bg-brand-dark text-brand-cream pt-24 pb-8 px-6 md:px-12 overflow-hidden border-t border-white/10">
            <div className="absolute inset-0 bg-grid-dark opacity-[0.05] pointer-events-none"></div>
            
            <div className="relative z-10 max-w-7xl mx-auto">
              
              <div className="flex justify-between items-end mb-16 footer-item">
                <div className="font-mono text-[10px] tracking-widest text-brand-accent uppercase flex items-center gap-3">
                  <div className="w-2 h-2 bg-brand-accent animate-pulse rounded-full"></div>
                  {t.footer.systemLabel}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-12 gap-12 md:gap-8 mb-24">
                
                <div className="md:col-span-5 footer-item">
                  <span className="font-mono text-[10px] uppercase tracking-widest text-brand-cream/40 mb-6 block border-b border-white/10 pb-4">
                    {t.footer.aboutLabel}
                  </span>
                  <p className="text-brand-cream/80 text-base leading-relaxed max-w-md">
                    {t.footer.about}
                  </p>
                </div>

                <div className="hidden md:block md:col-span-1"></div>

                {/* Triángulo: ubicación y contacto arriba, GitHub centrado abajo */}
                <div className="md:col-span-6 grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-10">
                  <div className="footer-item">
                    <span className="font-mono text-[10px] uppercase tracking-widest text-brand-cream/40 mb-6 block border-b border-white/10 pb-4">
                      {t.footer.locationLabel}
                    </span>
                    <p className="text-base text-brand-cream/90 flex items-center gap-2">
                      <MapPin size={16} className="text-brand-accent" /> {t.footer.location}
                    </p>
                  </div>

                  <div className="footer-item">
                    <span className="font-mono text-[10px] uppercase tracking-widest text-brand-cream/40 mb-6 block border-b border-white/10 pb-4">
                      {t.footer.contactLabel}
                    </span>
                    <a href="mailto:gonzalopilar2005@gmail.com" className="text-base text-brand-cream/90 hover:text-brand-accent transition-colors flex items-center gap-2 group">
                      <Mail size={16} className="text-brand-accent" />
                      gonzalopilar2005@gmail.com
                      <ArrowUpRight size={14} className="opacity-0 -translate-y-1 translate-x-1 group-hover:opacity-100 group-hover:translate-y-0 group-hover:translate-x-0 transition-all duration-300" />
                    </a>
                  </div>

                  <div className="footer-item md:col-span-2 md:max-w-md md:mx-auto md:mt-2">
                    <span className="font-mono text-[10px] uppercase tracking-widest text-brand-cream/40 mb-6 block border-b border-white/10 pb-4">
                      {t.footer.githubLabel}
                    </span>
                    <a href="https://github.com/goco41" target="_blank" rel="noopener noreferrer" className="text-base text-brand-cream/90 hover:text-brand-accent transition-colors flex items-center gap-2 group">
                      <Github size={16} className="text-brand-cream/40 group-hover:text-brand-accent transition-colors" />
                      {t.footer.githubLink}
                      <ArrowUpRight size={14} className="opacity-0 -translate-y-1 translate-x-1 group-hover:opacity-100 group-hover:translate-y-0 group-hover:translate-x-0 transition-all duration-300" />
                    </a>
                  </div>
                </div>
              </div>

              <div className="footer-line w-full h-px bg-white/10 mb-8 origin-left"></div>

              <div className="flex justify-between items-center footer-item font-mono text-[10px] uppercase tracking-widest opacity-40">
                <div className="flex items-center gap-4">
                  <span className="font-bold text-brand-cream">Gonzalo Pilar Sánchez</span>
                  <span className="hidden md:inline">© 2026 {t.footer.rights}</span>
                </div>
                <div>
                  <span>v 2.0.26</span>
                </div>
              </div>
              
            </div>
          </footer>
        );
      };

      const App = () => {
        const [lang, setLang] = useState('es');
        const [lenis, setLenis] = useState(null);
        useEffect(() => {
          const l = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), direction: 'vertical', smooth: true });
          function raf(time) { l.raf(time); requestAnimationFrame(raf); }
          requestAnimationFrame(raf); setLenis(l); return () => l.destroy();
        }, []);

        return (
          <LanguageContext.Provider value={{ lang, setLang, t: TRANSLATIONS[lang], lenis }}>
            <div className="w-full font-sans antialiased selection:bg-brand-accent selection:text-white">
              <Header />
              <main>
                <Hero />
                <Intro />
                <HorizontalProjects />
                <Sidequests />
                <EducationTimeline />
                <CertificationsAndSkills />
              </main>
              <Footer />
            </div>
          </LanguageContext.Provider>
        );
      };

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
